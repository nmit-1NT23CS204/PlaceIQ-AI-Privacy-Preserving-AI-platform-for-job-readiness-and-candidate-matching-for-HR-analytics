services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ai-service:
    build: ./ai-service
    environment:
      - PORT=8000

  backend:
    build: ./server
    depends_on:
      - mongodb
      - ai-service
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/placeiq
      - JWT_SECRET=your_super_secret_key_123
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=production

  frontend:
    build: ./client
    depends_on:
      - backend

  proxy:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data:

